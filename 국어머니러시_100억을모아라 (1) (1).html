<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>국어 머니러시 : 100억을 모아라!</title>
<meta name="theme-color" content="#1a0b3d">
<style>:root{--gold:#ffd34d;--gold2:#ffb800;--pink:#ff4fa3;--blue:#3ec6ff;--purple:#9b5cff;--green:#3dff9a;--red:#ff5470;
--bg1:#1a0b3d;--bg2:#3a0f5c;--card:rgba(255,255,255,.07);--line:rgba(255,255,255,.14);--txt:#fff;--sub:#cdbff5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0c0520;color:var(--txt);font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;overflow:hidden;touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text;font-family:inherit}
button{font-family:inherit;cursor:pointer;border:0;color:inherit;touch-action:manipulation}
img{-webkit-user-drag:none;user-select:none}
#app{position:fixed;inset:0;background:radial-gradient(1200px 700px at 50% -10%,var(--bg2),var(--bg1) 60%,#07031a);transition:background 1.5s}
#app.lv-1{--bg1:#16122b;--bg2:#2c2547}#app.lv-2{--bg1:#170d36;--bg2:#33175a}#app.lv-3{--bg1:#1a0b3d;--bg2:#3d1366}
#app.lv-4{--bg1:#1b0a40;--bg2:#4a1170}#app.lv-5{--bg1:#200a3e;--bg2:#5c1270}#app.lv-6{--bg1:#260a38;--bg2:#71145f}
#app.lv-7{--bg1:#2b0b2c;--bg2:#86204e}#app.lv-8{--bg1:#2e0d1e;--bg2:#9b3a1e}#app.lv-9{--bg1:#2f1408;--bg2:#b5650f}#app.lv-10{--bg1:#331a00;--bg2:#d99a00}
.hidden{display:none!important}
.gold-text{background:linear-gradient(180deg,#fff7c2 0%,#ffe066 30%,#ffb300 55%,#fff1a8 70%,#d98e00 100%);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #7a4a00) drop-shadow(0 0 18px rgba(255,200,40,.55))}
.btn3d{position:relative;border-radius:18px;padding:14px 22px;font-weight:900;font-size:18px;color:#3a2200;background:linear-gradient(180deg,#fff2a0,#ffc928 45%,#ff9f00);box-shadow:0 6px 0 #b36200,0 10px 20px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.8);transition:transform .08s,box-shadow .08s,filter .2s}
.btn3d:active:not(:disabled){transform:translateY(5px);box-shadow:0 1px 0 #b36200,0 4px 10px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.8)}
.btn3d:disabled{filter:grayscale(.85) brightness(.7);cursor:not-allowed}
.btn3d.pink{color:#fff;background:linear-gradient(180deg,#ff9fd0,#ff4fa3 50%,#d4186f);box-shadow:0 6px 0 #8a0a45,0 10px 20px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.6)}
.btn3d.blue{color:#fff;background:linear-gradient(180deg,#9fe6ff,#3ec6ff 50%,#1478d4);box-shadow:0 6px 0 #0b4a8a,0 10px 20px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.6)}
.btn3d.purple{color:#fff;background:linear-gradient(180deg,#d1b3ff,#9b5cff 50%,#6424d9);box-shadow:0 6px 0 #3b0f8a,0 10px 20px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.6)}
.btn3d.green{color:#053a1d;background:linear-gradient(180deg,#b8ffd8,#3dff9a 50%,#10b860);box-shadow:0 6px 0 #076b36,0 10px 20px rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.7)}
.btn3d.ghost{color:#fff;background:rgba(255,255,255,.12);box-shadow:0 4px 0 rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.3)}
.btn3d.sm{padding:9px 14px;font-size:15px;border-radius:14px}
.card{background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(255,255,255,.04));border:1px solid var(--line);border-radius:22px;box-shadow:0 10px 30px rgba(0,0,0,.35),inset 0 1px 0 rgba(255,255,255,.15);backdrop-filter:blur(6px)}
/* ---------- START ---------- */
#start{position:absolute;inset:0;overflow:hidden;display:flex;align-items:center;justify-content:center}
#startCanvas{position:absolute;inset:0;width:100%;height:100%}
.start-inner{position:relative;z-index:2;text-align:center;padding:20px;max-width:760px}
.start-badge{display:inline-block;padding:7px 16px;border-radius:30px;background:rgba(0,0,0,.45);border:1px solid rgba(255,215,90,.6);font-weight:800;color:#ffe9a6;letter-spacing:.5px;font-size:15px}
.start-title{font-size:clamp(34px,6.5vw,64px);font-weight:900;margin:14px 0 2px;letter-spacing:-1px}
.start-target{font-size:clamp(70px,17vw,170px);font-weight:900;line-height:1;margin:6px 0;letter-spacing:-4px;position:relative}
.start-target small{font-size:.35em;letter-spacing:0}
.shine{position:relative;overflow:hidden}
.shine::after{content:"";position:absolute;top:-20%;bottom:-20%;width:30%;left:-40%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.75),transparent);transform:skewX(-20deg);animation:shine 3.2s infinite;mix-blend-mode:overlay}
@keyframes shine{0%{left:-40%}55%,100%{left:130%}}
.start-slogan{font-size:clamp(20px,3.6vw,30px);font-weight:900;color:#fff;text-shadow:0 3px 0 #b3006b,0 0 20px #ff4fa3;margin:6px 0 22px}
.start-name{display:flex;gap:10px;justify-content:center;align-items:center;margin-bottom:18px;flex-wrap:wrap}
.start-name input{font-size:20px;padding:12px 16px;border-radius:14px;border:2px solid rgba(255,215,90,.6);background:rgba(0,0,0,.45);color:#fff;width:230px;text-align:center;font-weight:800}
#btnStart{font-size:clamp(26px,5vw,40px);padding:18px 60px;border-radius:26px;animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
.start-icons{position:absolute;inset:0;pointer-events:none;z-index:1}
.start-icons img{position:absolute;filter:drop-shadow(0 12px 18px rgba(0,0,0,.5));animation:bob 4s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-18px) rotate(4deg)}}
.start-foot{margin-top:16px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
/* ---------- GAME LAYOUT ---------- */
#game{position:absolute;inset:0;display:flex;flex-direction:column}
#hud{flex:0 0 auto;display:flex;align-items:center;gap:10px;padding:10px 12px;background:linear-gradient(180deg,rgba(0,0,0,.55),rgba(0,0,0,.2));border-bottom:1px solid rgba(255,215,90,.25);position:relative;z-index:5}
.avatar{position:relative;width:62px;height:62px;flex:0 0 62px;border-radius:50%;padding:4px}
.avatar::before{content:"";position:absolute;inset:0;border-radius:50%;background:conic-gradient(from 0deg,#ffd34d,#ff4fa3,#9b5cff,#3ec6ff,#ffd34d);animation:spin 6s linear infinite}
.avatar .in{position:relative;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle at 35% 30%,#4a2a8a,#1b0d3a);display:flex;align-items:center;justify-content:center}
.avatar img{width:44px;height:44px}
.avatar .lvtag{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);background:linear-gradient(180deg,#ffe36e,#ff9f00);color:#3a2200;font-weight:900;font-size:12px;padding:1px 7px;border-radius:9px;box-shadow:0 2px 0 #8a4a00;white-space:nowrap;animation:none}
@keyframes spin{to{transform:rotate(360deg)}}
.lvinfo{min-width:0;flex:0 1 180px}
.lvname{font-weight:900;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:5px}
.lvname img{width:22px;height:22px}
.lvbar{height:10px;border-radius:6px;background:rgba(255,255,255,.15);overflow:hidden;margin-top:5px;box-shadow:inset 0 1px 3px rgba(0,0,0,.5)}
.lvbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff4fa3,#ffd34d);transition:width .6s;border-radius:6px}
.lvnext{font-size:11px;color:var(--sub);margin-top:3px;white-space:nowrap}
.money{flex:1 1 auto;text-align:center;min-width:0}
.money .cash{font-size:clamp(20px,3.4vw,32px);font-weight:900;white-space:nowrap;display:flex;align-items:center;justify-content:center;gap:6px}
.money .cash img{width:30px;height:30px}
.money .nw{font-size:13px;color:#ffe9a6;font-weight:700}
.money .goal{height:7px;border-radius:5px;background:rgba(255,255,255,.12);margin:4px auto 0;max-width:360px;overflow:hidden}
.money .goal i{display:block;height:100%;background:linear-gradient(90deg,#ffd34d,#fff2a8,#ffb800);width:0;transition:width .8s}
.chips{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;flex:0 1 260px}
.chip{display:flex;align-items:center;gap:4px;padding:5px 9px;border-radius:12px;background:rgba(255,255,255,.1);font-weight:800;font-size:13px;white-space:nowrap;border:1px solid rgba(255,255,255,.12)}
.chip img{width:20px;height:20px}
.chip.on{background:linear-gradient(180deg,rgba(61,255,154,.35),rgba(16,184,96,.35));border-color:#3dff9a}
.chip.off{opacity:.75}
.chip.fever{background:linear-gradient(90deg,#ff7a00,#ffd34d);color:#3a1a00;animation:pulse .5s infinite}
.chip.review{background:linear-gradient(90deg,#3ec6ff,#9b5cff)}
.iconbtn{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.12);display:flex;align-items:center;justify-content:center;flex:0 0 44px;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.iconbtn img{width:28px;height:28px}
.iconbtn:active{transform:translateY(2px)}
main{flex:1 1 auto;overflow:hidden;position:relative}
.panel{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;padding:14px 14px 30px;-webkit-overflow-scrolling:touch;animation:panelIn .35s ease}
@keyframes panelIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.wrap{max-width:980px;margin:0 auto}
#tabs{flex:0 0 auto;display:flex;gap:6px;padding:8px 8px calc(8px + env(safe-area-inset-bottom));background:linear-gradient(0deg,rgba(0,0,0,.7),rgba(0,0,0,.35));border-top:1px solid rgba(255,215,90,.25);z-index:5}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 2px;border-radius:16px;background:rgba(255,255,255,.06);font-weight:900;font-size:14px;color:#d9ccff;position:relative;transition:background .2s}
.tab img{width:36px;height:36px;transition:transform .2s;filter:drop-shadow(0 4px 6px rgba(0,0,0,.4))}
.tab.active{background:linear-gradient(180deg,rgba(255,211,77,.35),rgba(255,79,163,.25));color:#fff;box-shadow:inset 0 0 0 2px rgba(255,211,77,.7)}
.tab.active img{transform:scale(1.18) translateY(-3px)}
.tab.locked{opacity:.5}
.tab .badge{position:absolute;top:2px;right:12%;background:var(--red);color:#fff;font-size:11px;padding:1px 6px;border-radius:9px;font-weight:900;animation:pulse 1s infinite}
/* ---------- QUEST ---------- */
.qmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tag{padding:5px 11px;border-radius:12px;font-size:13px;font-weight:900;background:rgba(255,255,255,.12)}
.tag.mode-normal{background:linear-gradient(90deg,#9b5cff,#ff4fa3)}
.tag.mode-retry{background:linear-gradient(90deg,#ff8a00,#ff4f4f)}
.tag.mode-review{background:linear-gradient(90deg,#3ec6ff,#1478d4)}
.tag.mode-boss{background:linear-gradient(90deg,#ff2a2a,#8a0000);animation:pulse 1s infinite}
.tag.diff{background:rgba(255,211,77,.18);color:#ffe36e}
.passage{padding:16px 18px;margin-bottom:12px;position:relative}
.passage h3{margin:0 0 8px;font-size:17px;display:flex;align-items:center;gap:8px;color:#ffe9a6}
.passage h3 img{width:26px;height:26px}
.passage .ptext{font-size:18px;line-height:1.85;white-space:pre-wrap;color:#fff;max-height:42vh;overflow-y:auto;padding-right:6px;user-select:text;-webkit-user-select:text}
.passage.poem .ptext{text-align:center;font-size:19px;line-height:2}
.passage .ptext::-webkit-scrollbar{width:8px}.passage .ptext::-webkit-scrollbar-thumb{background:rgba(255,211,77,.5);border-radius:5px}
.mk{color:#ffd34d;font-weight:900}
.passage .toggle{position:absolute;top:12px;right:12px}
.passage.collapsed .ptext{max-height:84px;overflow:hidden;mask-image:linear-gradient(180deg,#000 40%,transparent)}
.qcard{padding:18px;position:relative;overflow:hidden;min-height:270px}
.qnum{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:44px;border-radius:14px;background:linear-gradient(180deg,#ffe36e,#ff9f00);color:#3a2200;font-weight:900;font-size:20px;margin-right:10px;box-shadow:0 4px 0 #8a4a00;padding:0 8px}
.qtext{font-size:21px;font-weight:800;line-height:1.55;display:flex;align-items:flex-start}
.qtext span{flex:1}
.qbox{margin:12px 0 4px;padding:12px 16px;border-radius:14px;border:2px dashed rgba(255,211,77,.6);background:rgba(255,211,77,.08);font-size:18px;line-height:1.7;white-space:pre-wrap;font-weight:700}
.qhint{font-size:14px;color:var(--sub);margin:10px 0 6px;font-weight:700}
.opts{display:grid;gap:10px;margin-top:12px;position:relative}
.opt{display:flex;align-items:center;gap:12px;text-align:left;padding:14px 16px;border-radius:16px;font-size:18px;font-weight:800;line-height:1.45;background:linear-gradient(180deg,rgba(255,255,255,.16),rgba(255,255,255,.07));border:2px solid rgba(255,255,255,.18);box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .08s,background .2s,border-color .2s;min-height:58px}
.opt:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.35)}
.opt .num{flex:0 0 38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);font-size:19px;font-weight:900;color:#ffe36e}
.opt.sel{border-color:#ffd34d;background:linear-gradient(180deg,rgba(255,211,77,.4),rgba(255,159,0,.2))}
.opt.sel .num{background:#ffd34d;color:#3a2200}
.opt.correct{border-color:#3dff9a;background:linear-gradient(180deg,rgba(61,255,154,.45),rgba(16,184,96,.25));animation:pop .4s}
.opt.wrong{border-color:#ff5470;background:linear-gradient(180deg,rgba(255,84,112,.45),rgba(180,20,50,.25));animation:shake .4s}
.opt:disabled{cursor:default}
.opts.locked .opt{opacity:.55}
@keyframes pop{50%{transform:scale(1.04)}}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.think{position:absolute;inset:-4px;z-index:3;display:flex;align-items:center;justify-content:center;background:rgba(15,6,40,.55);backdrop-filter:blur(2px);border-radius:18px;flex-direction:column;gap:6px;font-weight:900;font-size:18px;color:#ffe9a6}
.ring{width:84px;height:84px;position:relative}
.ring svg{transform:rotate(-90deg)}
.ring b{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:32px;color:#fff}
.inputs{display:grid;gap:10px;margin-top:12px}
.inputs label{font-weight:800;font-size:15px;color:#ffe9a6}
.inp{width:100%;font-size:19px;padding:13px 15px;border-radius:14px;border:2px solid rgba(255,255,255,.25);background:rgba(0,0,0,.35);color:#fff;font-weight:700;outline:none}
.inp:focus{border-color:#ffd34d;box-shadow:0 0 0 4px rgba(255,211,77,.2)}
textarea.inp{min-height:96px;resize:vertical;line-height:1.5}
.tpl{font-size:19px;line-height:2.4;font-weight:700;white-space:pre-wrap}
.tpl input{width:150px;display:inline-block;padding:6px 10px;font-size:18px;vertical-align:middle;margin:0 4px}
.oxrow{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:rgba(255,255,255,.07);margin-top:8px;font-size:17px;font-weight:700}
.oxrow span{flex:1}
.oxbtn{width:58px;height:52px;border-radius:14px;font-size:26px;font-weight:900;background:rgba(255,255,255,.12);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.oxbtn.sel.o{background:#3ec6ff;color:#002}.oxbtn.sel.x{background:#ff5470}
.matchwrap{display:grid;gap:12px;margin-top:10px}
.mrow{padding:12px;border-radius:14px;background:rgba(255,255,255,.07)}
.mrow b{font-size:19px;display:block;margin-bottom:8px;color:#ffe36e}
.mopts{display:grid;gap:8px}
.submitrow{display:flex;justify-content:center;margin-top:16px;gap:10px;flex-wrap:wrap}
.warn{color:#ffb3c0;font-weight:800;text-align:center;margin-top:8px;min-height:20px}
.gate{position:absolute;inset:0;z-index:4;background:rgba(15,6,40,.97);border-radius:22px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:16px!important;gap:12px;text-align:center;padding:20px;font-weight:900}
.gate .bar{width:70%;height:12px;border-radius:8px;background:rgba(255,255,255,.15);overflow:hidden}
.gate .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ec6ff,#3dff9a)}
.gate img{width:72px;height:72px;animation:bob 2s infinite}
.qtools{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* feedback sheet */
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;max-height:88vh;overflow-y:auto;transform:translateY(105%);transition:transform .45s cubic-bezier(.2,1.3,.4,1);padding:0 10px 16px}
#sheet.show{transform:none}
#sheet .inner{max-width:900px;margin:0 auto;padding:18px 18px 20px;border-radius:26px 26px 22px 22px;background:linear-gradient(180deg,#2c1260,#160832);border:2px solid rgba(255,211,77,.5);box-shadow:0 -10px 40px rgba(0,0,0,.6)}
.fbhead{display:flex;align-items:center;gap:12px;font-size:30px;font-weight:900}
.fbhead img{width:60px;height:60px;animation:pop .6s}
.fbhead.ok{color:#3dff9a;text-shadow:0 0 18px rgba(61,255,154,.6)}.fbhead.no{color:#ff8fa3}
.rewards{margin:10px 0;display:grid;gap:6px}
.rw{display:flex;justify-content:space-between;align-items:center;padding:8px 12px;border-radius:12px;background:rgba(255,211,77,.12);font-weight:800;font-size:16px;animation:slideIn .4s both}
.rw b{color:#ffd34d;font-size:18px}.rw.neg{background:rgba(255,84,112,.12)}.rw.neg b{color:#ff8fa3}.rw.info{background:rgba(62,198,255,.12)}.rw.info b{color:#9fe6ff}
@keyframes slideIn{from{opacity:0;transform:translateX(-20px)}}
.ansbox{padding:12px 14px;border-radius:14px;background:rgba(61,255,154,.12);border:1px solid rgba(61,255,154,.5);font-weight:800;font-size:17px;margin:8px 0;line-height:1.6}
.expbox{padding:12px 14px;border-radius:14px;background:rgba(255,255,255,.08);font-size:17px;line-height:1.7;margin:8px 0}
.expbox b{color:#ffe36e}
.concept{padding:12px 14px;border-radius:14px;background:linear-gradient(135deg,rgba(62,198,255,.2),rgba(155,92,255,.2));border:1px solid rgba(62,198,255,.5);font-size:16px;line-height:1.7;margin:8px 0}
.concept b{color:#9fe6ff}
.mybox{padding:10px 14px;border-radius:14px;background:rgba(255,84,112,.1);font-size:15px;margin:8px 0;color:#ffd0d8}
.mission{margin:12px 0;padding:14px;border-radius:18px;background:linear-gradient(135deg,rgba(255,211,77,.18),rgba(255,79,163,.15));border:2px solid rgba(255,211,77,.6)}
.mission h4{margin:0 0 8px;font-size:18px;display:flex;align-items:center;gap:8px}
.mission h4 img{width:30px;height:30px}
.mission .opt{font-size:16px;min-height:50px}
.fbfoot{display:flex;justify-content:center;gap:10px;margin-top:12px;flex-wrap:wrap}
/* boss header in quest */
.bossbar{display:flex;align-items:center;gap:12px;padding:12px 14px;margin-bottom:12px;background:linear-gradient(135deg,rgba(255,40,40,.25),rgba(80,0,40,.4));border:2px solid rgba(255,80,80,.6)}
.bossbar img{width:84px;height:84px;filter:drop-shadow(0 0 16px rgba(255,60,60,.8));animation:bossIdle 2s ease-in-out infinite}
.bossbar.hit img{animation:bossHit .4s}
@keyframes bossIdle{50%{transform:translateY(-6px) scale(1.04)}}
@keyframes bossHit{0%{filter:brightness(3) drop-shadow(0 0 30px #fff)}50%{transform:translateX(14px) rotate(8deg)}100%{transform:none}}
.hp{flex:1}.hp .nm{font-weight:900;font-size:18px;margin-bottom:6px}
.hpbar{height:20px;border-radius:10px;background:rgba(0,0,0,.5);overflow:hidden;border:2px solid rgba(255,255,255,.3);position:relative}
.hpbar i{display:block;height:100%;background:linear-gradient(90deg,#ff2a2a,#ff8a00,#ffd34d);transition:width .5s}
.hpbar span{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;text-shadow:0 1px 2px #000}
.bosstries{font-size:13px;color:#ffc2c2;margin-top:4px;font-weight:700}
/* ---------- CITY ---------- */
.cityscene{position:relative;width:100%;aspect-ratio:16/9;max-height:52vh;border-radius:24px;overflow:hidden;border:2px solid rgba(255,211,77,.4);box-shadow:0 18px 40px rgba(0,0,0,.5)}
#cityCanvas{position:absolute;inset:0;width:100%;height:100%}
.plots{position:absolute;inset:0}
.plot{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;align-items:center;transition:all .5s}
.plot img.bld{display:block;transition:transform .6s cubic-bezier(.2,1.6,.4,1),filter .6s;filter:drop-shadow(0 10px 8px rgba(0,0,0,.55))}
.plot.closed img.bld{filter:grayscale(.65) brightness(.65) drop-shadow(0 10px 8px rgba(0,0,0,.55))}
.plot.lv3 img.bld{filter:drop-shadow(0 0 10px rgba(255,211,77,.7)) drop-shadow(0 10px 8px rgba(0,0,0,.5))}
.plot.lv4 img.bld{filter:drop-shadow(0 0 16px rgba(255,79,163,.85)) drop-shadow(0 10px 8px rgba(0,0,0,.5))}
.plot.lv5 img.bld{filter:drop-shadow(0 0 22px rgba(255,230,90,1)) drop-shadow(0 0 40px rgba(255,180,0,.7)) drop-shadow(0 10px 8px rgba(0,0,0,.5));animation:glowBld 2s infinite}
@keyframes glowBld{50%{transform:translateY(-4px)}}
.plot .stars{font-size:11px;color:#ffd34d;text-shadow:0 1px 2px #000;white-space:nowrap;margin-top:-2px;font-weight:900}
.plot .crown{position:absolute;top:-22px;left:50%;margin-left:-15px;width:30px;animation:bob 2s infinite}
.plot .empty{width:60px;height:24px;border-radius:50%;border:2px dashed rgba(255,255,255,.35);background:rgba(0,0,0,.25)}
.plot .pad{width:110%;height:12px;border-radius:50%;background:radial-gradient(rgba(0,0,0,.55),transparent 70%);margin-top:-6px}
.plot.built img.bld{animation:buildIn .9s cubic-bezier(.2,1.6,.4,1)}
@keyframes buildIn{0%{transform:translateY(-120px) scale(.2);opacity:0}100%{transform:none;opacity:1}}
.inc-float{position:absolute;font-weight:900;font-size:13px;color:#ffe36e;text-shadow:0 2px 3px #000;pointer-events:none;animation:floatUp 1.4s ease-out forwards;white-space:nowrap}
@keyframes floatUp{from{opacity:1;transform:translate(-50%,0)}to{opacity:0;transform:translate(-50%,-40px)}}
.citybanner{position:absolute;left:50%;top:12px;transform:translateX(-50%);padding:8px 16px;border-radius:14px;font-weight:900;font-size:15px;white-space:nowrap;z-index:3}
.citybanner.closed{background:rgba(0,0,0,.65);border:2px solid #ff5470;color:#ffd0d8}
.citybanner.open{background:rgba(0,40,20,.6);border:2px solid #3dff9a;color:#b8ffd8}
.citystats{display:flex;gap:10px;flex-wrap:wrap;margin:12px 0}
.stat{flex:1 1 150px;padding:12px 14px;text-align:center}
.stat .v{font-size:20px;font-weight:900;color:#ffd34d}.stat .k{font-size:13px;color:var(--sub);font-weight:700}
.blist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.bcard{display:flex;gap:12px;align-items:center;padding:12px;position:relative}
.bcard .ic{width:76px;height:76px;flex:0 0 76px;border-radius:18px;background:radial-gradient(circle at 40% 30%,rgba(255,255,255,.25),rgba(0,0,0,.2));display:flex;align-items:center;justify-content:center}
.bcard .ic img{width:66px;height:66px}
.bcard .info{flex:1;min-width:0}
.bcard .nm{font-weight:900;font-size:17px}
.bcard .lv{font-size:13px;color:#ffd34d;font-weight:800}
.bcard .inc{font-size:13px;color:var(--sub);font-weight:700;margin:2px 0 6px}
.bcard.locked{opacity:.5}
.bcard .price s{opacity:.6;font-size:12px}
/* ---------- SHOP ---------- */
.shopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.pcard{padding:14px;text-align:center;position:relative;overflow:hidden;transition:transform .2s}
.pcard .pic{height:110px;display:flex;align-items:center;justify-content:center;position:relative}
.pcard .pic::before{content:"";position:absolute;width:110px;height:110px;border-radius:50%;background:radial-gradient(rgba(255,211,77,.45),transparent 70%);animation:pulse 2.5s infinite}
.pcard .pic img{width:96px;height:96px;position:relative;filter:drop-shadow(0 10px 10px rgba(0,0,0,.5));transition:transform .3s}
.pcard:hover .pic img{transform:scale(1.1) rotate(-5deg)}
.pcard .nm{font-weight:900;font-size:18px;margin-top:4px}
.pcard .pr{font-weight:900;color:#ffd34d;font-size:17px;margin:2px 0}
.pcard .perk{font-size:12.5px;color:var(--sub);min-height:34px;font-weight:700}
.pcard .own{position:absolute;top:10px;right:10px;background:#3dff9a;color:#053a1d;font-weight:900;font-size:12px;padding:2px 8px;border-radius:9px}
.pcard.target{border:3px solid #ff4fa3;box-shadow:0 0 30px rgba(255,79,163,.6)}
.lockover{padding:40px 20px;text-align:center}
.lockover img{width:100px;height:100px}
.lockover h2{margin:10px 0}
#missionBar{position:fixed;top:92px;left:50%;transform:translateX(-50%);z-index:30;padding:10px 16px;border-radius:16px;background:linear-gradient(90deg,#ff4fa3,#9b5cff);font-weight:900;font-size:15px;box-shadow:0 8px 24px rgba(0,0,0,.5);display:flex;align-items:center;gap:10px;max-width:94vw;border:2px solid #fff3}
#missionBar img{width:30px;height:30px}
#missionBar .t{font-size:22px;color:#ffe36e;min-width:44px;text-align:center}
/* ---------- BOX ---------- */
.boxgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.boxcard{padding:14px;text-align:center}
.chest{width:110px;height:96px;margin:6px auto 8px;position:relative;border-radius:16px 16px 12px 12px;box-shadow:inset 0 -10px 0 rgba(0,0,0,.25),0 10px 20px rgba(0,0,0,.45);display:flex;align-items:center;justify-content:center}
.chest::before{content:"";position:absolute;left:-4px;right:-4px;top:-6px;height:34px;border-radius:16px 16px 6px 6px;background:inherit;filter:brightness(1.2);box-shadow:0 3px 0 rgba(0,0,0,.3)}
.chest::after{content:"";position:absolute;top:22px;width:22px;height:26px;border-radius:5px;background:linear-gradient(#fff6c2,#ffb800);box-shadow:0 2px 0 #8a4a00}
.chest img{position:absolute;bottom:4px;width:42px;height:42px;z-index:2}
.t1{background:linear-gradient(180deg,#b0855a,#6b4524)}.t2{background:linear-gradient(180deg,#e6edf5,#8796a8)}.t3{background:linear-gradient(180deg,#ffe36e,#d98e00)}.t4{background:linear-gradient(180deg,#9ff0ff,#3a8bff)}.t5{background:linear-gradient(180deg,#fff2a8,#ff9f00,#ff4fa3)}
.t5{animation:legendGlow 1.5s infinite}
@keyframes legendGlow{50%{box-shadow:0 0 30px #ffd34d,0 0 60px #ff4fa3,inset 0 -10px 0 rgba(0,0,0,.25)}}
.boxcard .nm{font-weight:900;font-size:17px}.boxcard .pr{color:#ffd34d;font-weight:900;margin:3px 0 8px}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;margin-top:10px}
.invitem{display:flex;align-items:center;gap:10px;padding:10px 12px}
.invitem img{width:40px;height:40px}.invitem .tx{flex:1;font-weight:800;font-size:14px}
/* box opening */
#boxOpen{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column;background:rgba(5,2,15,.85)}
#boxOpen .rays{position:absolute;width:900px;height:900px;background:repeating-conic-gradient(from 0deg,rgba(255,220,100,.28) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:spin 8s linear infinite;mask-image:radial-gradient(circle,#000 20%,transparent 65%);opacity:0;transition:opacity .5s}
#boxOpen.reveal .rays{opacity:1}
#boxOpen .bchest{transform:scale(1.8);animation:chestShake .15s infinite}
@keyframes chestShake{0%,100%{transform:scale(1.8) rotate(-4deg)}50%{transform:scale(1.8) rotate(4deg)}}
#boxOpen .prize{text-align:center;position:relative;animation:prizeIn .7s cubic-bezier(.2,1.6,.4,1)}
#boxOpen .prize img{width:160px;height:160px;filter:drop-shadow(0 0 40px rgba(255,220,100,.9))}
#boxOpen .prize h2{font-size:34px;margin:8px 0}
@keyframes prizeIn{from{transform:scale(0) rotate(-30deg)}to{transform:none}}
#boxOpen.dark{background:#000}
#flash{position:fixed;inset:0;z-index:70;pointer-events:none;background:radial-gradient(circle,#fff,#ffd34d 40%,transparent 75%);opacity:0}
#flash.go{animation:flash 1s ease-out}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
/* ---------- BOSS LIST ---------- */
.bosslist{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.bosscard{padding:14px;text-align:center;position:relative}
.bosscard img{width:110px;height:110px;filter:drop-shadow(0 0 18px rgba(255,60,60,.7))}
.bosscard.locked img{filter:brightness(0) drop-shadow(0 0 6px rgba(255,255,255,.3))}
.bosscard.dead img{filter:grayscale(1) opacity(.6)}
.bosscard .nm{font-weight:900;font-size:18px}.bosscard .ds{font-size:13px;color:var(--sub);margin:4px 0 8px;font-weight:700}
.bosscard .st{position:absolute;top:10px;right:10px;font-size:12px;font-weight:900;padding:3px 8px;border-radius:9px;background:#3dff9a;color:#053a1d}
/* ---------- MODAL / TOAST / POPUPS ---------- */
#modal{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;background:rgba(5,2,15,.75);padding:14px;backdrop-filter:blur(4px)}
#modal .box{width:min(960px,100%);max-height:92vh;overflow-y:auto;padding:22px;border-radius:26px;background:linear-gradient(180deg,#2c1260,#160832);border:2px solid rgba(255,211,77,.5);animation:prizeIn .4s;position:relative}
#modal h2{margin:0 0 12px;display:flex;align-items:center;gap:10px}
#modal h2 img{width:40px;height:40px}
.mclose{position:absolute;top:12px;right:12px}
#toast{position:fixed;top:96px;left:50%;transform:translateX(-50%);z-index:80;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:94vw}
.toast{padding:11px 18px;border-radius:16px;background:rgba(20,8,50,.92);border:2px solid rgba(255,211,77,.6);font-weight:900;font-size:16px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:toastIn .4s cubic-bezier(.2,1.6,.4,1);display:flex;align-items:center;gap:8px;max-width:100%;text-align:center}
.toast img{width:28px;height:28px}
.toast.bad{border-color:#ff5470}.toast.good{border-color:#3dff9a}
@keyframes toastIn{from{transform:translateY(-30px) scale(.8);opacity:0}}
#popups{position:fixed;inset:0;pointer-events:none;z-index:45}
.pop{position:absolute;font-weight:900;font-size:30px;white-space:nowrap;transform:translate(-50%,-50%);animation:popUp 1.6s ease-out forwards}
.pop.big{font-size:52px}
@keyframes popUp{0%{opacity:0;transform:translate(-50%,-30%) scale(.4)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.25)}30%{transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-160%) scale(1)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:46}
#feverOverlay{position:fixed;inset:0;pointer-events:none;z-index:4;opacity:0;transition:opacity .4s;background:radial-gradient(ellipse at center,transparent 40%,rgba(255,190,0,.45) 100%);box-shadow:inset 0 0 80px 20px rgba(255,200,0,.7)}
#feverOverlay.on{opacity:1;animation:feverPulse .6s infinite}
@keyframes feverPulse{50%{box-shadow:inset 0 0 120px 40px rgba(255,140,0,.8)}}
#app.fever{filter:saturate(1.3)}
.feverText{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);z-index:47;font-size:clamp(50px,11vw,120px);font-weight:900;pointer-events:none;animation:feverIn 1.5s ease-out forwards;white-space:nowrap}
@keyframes feverIn{0%{transform:translate(-50%,-50%) scale(3) rotate(-10deg);opacity:0}20%{transform:translate(-50%,-50%) scale(1) rotate(-4deg);opacity:1}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.3)}}
.shakeScreen{animation:screenShake .5s}
@keyframes screenShake{10%,50%,90%{transform:translate(-10px,4px)}30%,70%{transform:translate(10px,-4px)}}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th,table.st td{padding:7px 8px;border-bottom:1px solid rgba(255,255,255,.12);text-align:left;vertical-align:top}
table.st th{background:rgba(255,211,77,.15);position:sticky;top:-22px}
.sgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.sgrid .stat .v{font-size:22px}
.pinpad{display:flex;flex-direction:column;align-items:center;gap:12px;padding:10px}
.pinpad input{font-size:30px;letter-spacing:12px;text-align:center;width:200px;padding:10px;border-radius:14px;border:2px solid #ffd34d;background:rgba(0,0,0,.4);color:#fff}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.slider{width:220px;accent-color:#ffd34d}
.help li{margin:6px 0;line-height:1.6}
.sec-title{font-size:20px;font-weight:900;margin:18px 0 10px;display:flex;align-items:center;gap:8px}
.sec-title img{width:32px;height:32px}
.empty-note{padding:14px;text-align:center;color:var(--sub);font-weight:700}
@media (max-width:720px){
 #hud{flex-wrap:wrap;gap:6px;padding:8px}
 .lvinfo{flex:1 1 120px}
 .money{order:3;flex:1 1 100%}
 .chips{order:4;flex:1 1 100%;justify-content:center}
 .qtext{font-size:19px}.opt{font-size:17px}
 .tab span{font-size:12px}.tab img{width:30px;height:30px}
 #missionBar{top:150px}
}
@media print{body *{visibility:hidden}#modal,#modal *{visibility:visible}#modal{position:absolute;background:#fff;color:#000}#modal .box{background:#fff;color:#000;max-height:none;border:0}table.st th{background:#eee}.noprint{display:none!important}}
@keyframes carR{from{left:-12%}to{left:106%}}@keyframes carL{from{left:106%}to{left:-12%}}
.bump{animation:bump .35s}@keyframes bump{40%{transform:scale(1.12);filter:brightness(1.4)}}
.expbox.red{background:rgba(255,40,70,.12);border:2px solid rgba(255,84,112,.7);color:#ff6b7f;font-weight:800}.expbox.red b{color:#ff3b5c}.concept.red{background:rgba(255,40,70,.08);border-color:rgba(255,84,112,.5);color:#ff8a9b}.concept.red b{color:#ff5470}

 poem:{title:'기뻐의 비밀',kind:'poem',text:`내가 기뻐의 비밀을 말해 줄까?

 s1:{title:'이야기 (가방 가게)',kind:'story',text:`헐레벌떡 가게 문을 여니 승한이는 막 계산을 마치고 가방을 받고 있었다. 그 모습을 본 서영이는 깜짝 놀라 다급하게 소리를 질렀다. 가방 구경을 못 해서 소리 지르는 것 같지는 않았다.
“잠깐! 아저씨, 잠깐만요.”
서영이의 말에 승한이와 아저씨가 동시에 서영이를 쳐다봤다.
“왜 그래?”
“야! 정승한. 너 이 가방, 버지5 아니잖아. 만날 가지고 싶다고 노래 부르더니, 이게 뭐야?”
“그, 그게……. 버지5도 좋은데 아저씨가 지금은 다 떨어졌다고 해서. 이 가방도 좋은 거래.”
서영이의 추궁에 승한이가 우물쭈물하더니 기어드는 소리로 말했다. 눈치를 살피던 아저씨도 재빠르게 끼어들었다.
“학생 말이 맞아. 그 가방은 곧 유행이 끝나. 앞으로는 이 가방이 유행할 거야. 이거 사면 절대 후회 안 해.”
“아저씨, 잠깐만요. 야! 정승한, 너 똑바로 말해. 지금 이 가방이 좋아, 아니면 버지5 가방이 가지고 싶어?”
“버지5가 좋긴 더 좋은데, 이 가방도 괜찮지 않을까?”
“거봐, 이 학생도 괜찮다고 하잖아.”
그때였다. 옆에 있던 서영이가 승한이의 가방을 낚아채더니 다시 주인아저씨에게 돌려줬다.
“아니에요. 얜 이 가방 안 살 거예요.”`},
 s2:{title:'이야기 (스님과 사슴)',kind:'story',text:`(가) “옛날 어느 산속에 절이 있었어. 그곳에 사는 스님들은 절 공터에 채소를 심어서 키웠어. 그러자 산속에 사는 어린 사슴이 내려와서 자꾸 채소를 먹기 시작했지. 스님들은 어린 사슴이 귀엽고 안됐다는 생각에 채소를 먹어도 쫓아내지 않았어. 처음에는 조심스럽게 채소를 먹던 사슴도 점점 아무 때나 와서 스님들을 보고 반가워하며 편하게 채소를 먹었지.”
어느새 서영이와 승한이는 진우의 이야기를 경청하고 있었다.
“어느 날, 한 스님이 막대기를 휘두르며 그 사슴을 쫓아내 버렸어. 다른 스님들은 모두 그 스님에게 화를 냈어. 그깟 채소야 또 키우면 되는데, 그게 아까워서 배고픈 사슴을 쫓아내느냐고 말이야. 하지만 그 스님은 그게 아니라고 했어. 세상이 다 스님 같은 사람들만 있는 게 아니라 사냥꾼도 있다고. 만약 사슴이 사냥꾼을 스님으로 알고 다가간다면 사슴은 그 자리에서 죽는 거야. 그래서 진짜 사슴을 위한다면 지금 당장 먹이를 주는 것보다 사람을 조심해야 하는 걸 가르쳐야 한다고 말이야.”
(나) “지금 무슨 이야기를 하는 거야? 하나도 이해를 못 하겠어.”
진우는 그런 승한이의 손을 잡고 뚫어지게 눈을 바라봤다.
“내가 보기에 넌 사슴하고 다를 게 하나도 없어. 사슴이 사람 무서운 줄 모르고 살다 어느 순간 나쁜 사람을 만나면 한순간에 목숨이 위험할 수 있듯이, 너도 무조건 네가 손해 보거나 양보만 하다가 진짜 나쁜 사람을 만나면 정말 큰일을 당할 수도 있다고. 서영이는 그런 너를 위해 스님처럼 막대기를 휘둘러 준 거야.”
승한이는 뭔가로 맞은 듯이 정신이 번쩍했다.`},
 s3:{title:'이야기 (진우의 충고)',kind:'story',text:`지금까지 승한이는 그냥 자기 마음 편하자고 계속 미루던 게 있었다. 바로 친구들의 마음을 확인하는 것이었다. 친구들이 나를 정말 좋아할까. 먹을 걸 사 주지 않아도, 숙제를 해 주지 않아도 나와 친하게 지낼까. 승한이는 그저 궁금해만 했을 뿐 그걸 확인할 용기가 없었다.
㉠“내 말이 바로 그 말이야. 너 그러다가 진짜 사기꾼 같은 사람 만나면 큰일 난다고. 거봐, 내가 다 널 위해서 그런 거라니까!”
서영이가 ㉡기세등등해서 속이 시원하다는 듯 소리쳤다. 하지만 진우는 서영이에게도 한마디 했다.
“내가 보기엔 서영이 너도 좀 문제야.”
그 말에 서영이도 금방 찬물을 뒤집어쓴 얼굴이 되었다.
“나는 또 왜?”
진우는 따져 묻는 서영이를 가만히 쳐다보며 말했다.
“확실히 서영이 넌 대단해. 말도 조리 있게 잘하고 논리적이야. 하지만 서영이 네가 알아야 할 건, 친구들이 좋아하는 사람은 이해를 해 주는 친구지, 자신의 잘못을 조목조목 짚어 가며 ㉢교정해 주는 사람이 아니라는 거야. 우리 모두는 친구를 원하는 거지 논리 선생님을 구하는 건 아니니까.”
진우는 또박또박 말을 이어 갔다.
“그리고 같은 말이라도 얼마든지 다른 느낌으로 할 수 있어. 너처럼 상대방의 기분은 생각하지 않고 쏟아 내면 아무리 네가 옳은 말을 한다고 해도 친구들은 점점 떠날 거야. 넌 한 번이라도 상대방의 입장이 돼서 생각하고 말해 본 적 있니?”
서영이의 표정이 굳어졌다. 정말이지 진우는 이상하고 신비한 아이였다. 진우의 말을 듣고 있으니 지금까지 갖고 있던 친구 관계에서의 의문이 풀리는 느낌이었다.`},
 s4:{title:'이야기 (서영이의 깨달음)',kind:'story',text:`전학 오기 전의 일이 생각났다. 윤이와 멀어지고도 별문제 없이 아이들과 잘 지냈다. 그러다가 친구들과 멀어진 건 아이들이 가득 있는 교실에서 짝이었던 소은이에게 이상한 냄새가 난다고 말했을 때부터였다. 물론 놀리거나 괴롭히려는 생각은 눈곱만큼도 없었다. ㉠그냥 친한 친구한테 안 좋은 냄새가 나는 게 싫어 깨끗이 씻고 다니길 원했을 뿐인데, 소은이와 다른 사람들은 그 말을 전혀 다르게 받아들였다.
서영이는 잠시 소은이가 된 상상을 해 봤다. 그러자 불에 덴 것처럼 마음이 따갑고 아팠다. 아이들이 잔뜩 모인 곳에서 그런 말을 들었다는 것만으로도 부끄러워 주저앉고 싶었다.
생각해 보니 얼마 전 회장 기윤이와 다툰 일도 마찬가지였다. 기윤이도 나쁜 생각으로 승한이를 말린 것은 아닌 것 같았다. 자기도 기윤이라면 똑같이 충고했을 것이다. 석민이와 재윤이 숙제를 해 주던 걸 승한이한테 뭐라 할 때도 그랬다. 그 순간 서영이는 깨달았다. 자신은 그중 한 번도 상대의 입장에서 생각하지 않고 그저 자기가 옳다고 믿는 대로, 하고 싶은 말을 다 했다는 것을 말이다.`},
 t1:{title:'화살나무를 아시나요?',kind:'explain',text:`봄날의 화려한 꽃이 지고 필 때 눈에 띄지 않게 꽃이 피는 식물이 있습니다. 바로 화살나무입니다. 사실 화살나무는 아파트 정원이나 공원, 심지어는 도로변에 많이 심겨 있어 관심만 가지면 쉽게 찾아볼 수 있습니다. 화살나무라는 이름은 어떻게 해서 붙었을까요? 그것은 이 나무의 가지를 보면 알 수 있답니다.
가지에는 코르크 재질의 날개처럼 생긴 것이 2~4줄 보이는데, 그 모습이 화살의 날개처럼 생겨서 화살나무라는 이름이 붙었습니다. 키 작은 떨기나무인 화살나무의 꽃은 정말로 작습니다. 꽃 색도 황록색이라 눈에 잘 들어오지 않습니다. 그래도 꽃받침과 꽃잎이 4장씩 있으며, 수술도 4개 있습니다. 화살나무는 가을에 붉게 단풍이 들었을 때 무척 예쁜 나무랍니다. 게다가 잎이 다 떨어졌을 때 보이는 빨간 열매도 귀엽습니다.`},
 t2:{title:'화살나무',kind:'explain',text:`가지에는 코르크 재질의 날개처럼 생긴 것이 2~4줄 보이는데, 그 모습이 화살의 날개처럼 생겨서 화살나무라는 이름이 붙었습니다. 키 작은 떨기나무인 화살나무의 꽃은 정말로 작습니다. 꽃 색도 황록색이라 눈에 잘 들어오지 않습니다. 그래도 꽃받침과 꽃잎이 4장씩 있으며, 수술도 4개 있습니다. 화살나무는 가을에 붉게 단풍이 들었을 때 무척 예쁜 나무랍니다. 게다가 잎이 다 떨어졌을 때 보이는 빨간 열매도 귀엽습니다.
화살나무는 예부터 많은 먹거리를 제공해 왔습니다. 두릅나무의 새순을 먹는 것처럼 화살나무의 새순도 먹을 수 있답니다. 무쳐 먹거나 된장국에 넣어 먹거나 나물밥을 해 먹을 수도 있습니다. 심지어는 봄에 채취하여 말린 뒤 약재로도 썼다고 해요. 이뿐만 아니라 고름을 빼는 데 쓰는 고약의 원료로 화살나무의 날개와 열매를 사용했다고 합니다.`},
 m1:{title:'약, 잘 쓰고 잘 버리는 방법',kind:'explain',text:`약을 잘 쓰고 잘 버리는 건 우리 자신의 건강을 위해서뿐만 아니라 다른 사람들, 다른 생물들, 또 우리 후손의 건강을 위해서도 중요한 일이에요. 여러분은 혹시 ‘폐의약품 ㉠수거’에 대해 들어 본 적 있나요?
약은 환경 오염을 일으킬 수 있기 때문에 잘 버려야 해요. 더 이상 쓰지 않는 약을 약국이나 보건소에 가져가면, 모아서 따로 버려 준답니다. 쓰레기통이나 하수구 등 아무 곳에나 버리지 않도록 말이에요.
약도 우유나 빵처럼 소비 기한이 있다는 사실, 알고 있나요? 약은 소비 기한이 지나면 약효가 떨어질 뿐 아니라 상할 수도 있어요. 그래서 약을 제대로 보관하고 쓰는 것은 버리는 약을 줄이기 위해서도, 제대로 된 치료를 위해서도 무척 중요한 일이에요.
그렇다면 약을 어떻게 보관하고 써야 할까요? 약국에서 약을 사면 상자에 소비 기한이 적혀 있지요? 사용 설명서도 함께 들어 있고 말이에요. 대부분의 가정에서는 여러 가지 약을 한곳에 보관하기 때문에 설명서가 없으면 나중에 어느 약을 어디에 써야 할지 모르는 경우가 곧잘 생겨요. 또 약상자가 없으면 소비 기한이 얼마나 남았는지 알 수가 없어서 쓰지 못하게 되기도 해요. 그러니 약은 반드시 상자와 사용 설명서를 함께 보관하고, 보관할 때는 사용 설명서에 적힌 보관법대로 보관해야 해요. 소비 기한은 적절하게 보관했을 경우에 적용되거든요.`},
 m2:{title:'약, 잘 쓰고 잘 버리는 방법',kind:'explain',text:`병원에서 준 처방전으로 약을 지었을 때에는 의사 선생님이 처방해 주신 대로 바로바로 먹는 게 중요해요. 약을 남겨 뒀다가 다음번에 비슷한 증상이라고 함부로 먹는 건 위험한 일이랍니다. 언뜻 비슷해 보여도 실제 몸 상태는 다를 수 있기 때문에 부작용이 생길 수 있어요. 게다가 일단 개봉된 처방 약은 여러 약이 섞여 있기 때문에 확실한 소비 기한도 알 수가 없거든요.
우리가 버린 쓰레기 대부분은 땅에 묻히거나 하수구를 통해 강으로 흘러 들어가요. 어떤 쓰레기든 함부로 버리면 환경을 오염시키지만 특히나 약의 경우에는 그 정도가 더 심각하다고 해요. ㉠땅에 묻히거나 강으로 흘러 들어간 약은 환경에 어떤 영향을 미치게 될까요?
폐의약품 수거의 결과로 모이는 약 중에는 항생제나 성호르몬이 포함된 약도 있어요. 이런 약이 환경에 흘러 들어간다면 생물들의 번식에 심각한 영향을 미칠 수 있어요. 우리가 버리는 약을 물고기들이 먹을 수 있답니다. 쓰레기통에 버린다고 해서 약이 사라지는 건 아니에요. 결국 어디론가 흘러가서 환경을 오염시키지요. 죄 없는 물고기들에게 피해를 주기도 하면서 말이에요.`},
 m3:{title:'약, 잘 쓰고 잘 버리는 방법',kind:'explain',text:`그런데 남은 약 모으기는 꼭 물고기들을 위한 것만은 아니에요. 우리 모두를 위한 거랍니다. 과학자들은 버려진 약들이 사람에게 어떤 영향을 미칠지 알 수 없다고 경고하고 있어요.
항생제를 예로 들어 볼까요? 항생제는 우리 몸에 병을 일으키는 균을 죽이는 약이에요. 그런데 이 균들도 항생제의 공격을 자주 받다 보면 항생제를 물리칠 요령을 ( ㉠ )하게 된답니다. 항생제가 공격해도 죽지 않을 수 있게 자기 몸을 바꾸는 거지요. 이렇게 바뀐 균을 ‘내성균’이라고 해요. 내성이란 ‘견딜 수 있는 힘’이라는 뜻이에요. 항생제를 많이 쓰면 쓸수록 내성균이 많이 생기고, 그러면 병에 걸렸을 때 치료제의 효과가 없을 수도 있어요.
그러니까 항생제가 많이 버려지면 산과 들을 떠돌아다니며 물고기나 동물들에게 나쁜 영향을 미치고, 또 그 영향이 사람에게로 돌아오지 않겠어요? 미래의 우리 후손들에게도 말이에요.
그러니 이건 나 혼자만의 문제가 아니라 전 인류, 전 생물의 문제가 되는 거랍니다. 이렇게 약을 잘 쓰고 잘 버린다는 건 우리 모두의 건강과 환경을 지키는 일이에요.`},
 m4:{title:'약, 잘 쓰고 잘 버리는 방법',kind:'explain',text:`(가) 그렇다면 약을 어떻게 보관하고 써야 할까요? 약국에서 약을 사면 상자에 소비 기한이 적혀 있지요? 사용 설명서도 함께 들어 있고 말이에요. 대부분의 가정에서는 여러 가지 약을 한곳에 보관하기 때문에 설명서가 없으면 나중에 어느 약을 어디에 써야 할지 모르는 경우가 곧잘 생겨요. 또 약상자가 없으면 소비 기한이 얼마나 남았는지 알 수가 없어서 쓰지 못하게 되기도 해요. 그러니 약은 반드시 상자와 사용 설명서를 함께 보관하고, 보관할 때는 사용 설명서에 적힌 보관법대로 보관해야 해요. 소비 기한은 적절하게 보관했을 경우에 적용되거든요.

 if(Math.abs(s.cash-(s.earned-s.spent))>5)why.push('자산 계산 불일치');
 if(!Array.isArray(s.b)||s.b.length!==10||!s.b.every(v=>isInt(v,0,MAXLV)))why.push('건물 데이터 이상');

 if(!Array.isArray(s.inv)||s.inv.length!==10||!s.inv.every(v=>isNum(v,0,1e14)))why.push('투자 데이터 이상');
 else for(let i=0;i<10;i++){let full=0;for(let l=1;l<=s.b[i];l++)full+=l===1?BUILDS[i].cost:BUILDS[i].cost*UPC[l-1];if(s.inv[i]>full+5||s.inv[i]<full*0.49-5)why.push('건물 가격 불일치')}
 let itemSum=0;for(const k in s.items){const it=ITEMS.find(x=>x.k===k);if(!it||!isInt(s.items[k],0,999)){why.push('아이템 이상');break}itemSum+=it.p*s.items[k]}
 if(Math.abs(itemSum-s.itemPaid)>5)why.push('아이템 가격 불일치');
 const invSum=(s.inv||[]).reduce((a,b)=>a+(+b||0),0);
 if(s.spent+5<invSum+s.itemPaid+s.boxPaid)why.push('지출 기록 불일치');
 if(!isNum(s.boxPaid,0,1e14))why.push('상자 기록 이상');
 const t=s.tk;if(!Array.isArray(t.disc)||t.disc.length>60||!t.disc.every(v=>[10,20,30,50].includes(v)))why.push('할인권 이상');
 for(const k of ['mult2','feverT','boost'])if(!isInt(t[k],0,200))why.push('아이템권 이상');
 if(!isInt(t.crown,0,3))why.push('왕관 이상');t.feverArmed=t.feverArmed?1:0;
 if(!isNum(s.mult2Sec,0,3600))s.mult2Sec=0;
 if(!isInt(s.combo,0,99999)||!isInt(s.maxCombo,0,99999))why.push('콤보 이상');
 if(!isInt(s.level,1,10))why.push('레벨 이상');
 if(!isNum(s.open,0,200))s.open=0;
 if(!isInt(s.seq,0,1e12))why.push('일련번호 이상');
 if(!Array.isArray(s.paid))s.paid=[];
 if(s.earned>0&&s.cnt.correct<1)why.push('문제 풀이 없이 돈이 있음');
 if(s.earned>Math.max(1,s.cnt.correct)*3e8+invSum*300+1e10)why.push('수입이 비정상적으로 큼');
 if(!Array.isArray(s.deck)||!s.deck.every(id=>QMAP[id]))s.deck=[];
 if(!Array.isArray(s.retryQ))s.retryQ=[];s.retryQ=s.retryQ.filter(r=>r&&QMAP[r.qid]&&isInt(r.after,0,99));
 if(!Array.isArray(s.wrongNote))s.wrongNote=[];s.wrongNote=s.wrongNote.filter(id=>QMAP[id]);
 if(typeof s.qs!=='object'||!s.qs)s.qs={};
 for(const id in s.qs){if(!QMAP[id]){delete s.qs[id];continue}const q=s.qs[id];if(typeof q!=='object'||!isInt(q.a,0,1e6)||!isInt(q.c,0,1e6)||!isInt(q.w,0,1e6)||q.c+q.w!==q.a){why.push('문제 기록 이상');break}}
 if(!Array.isArray(s.log))s.log=[];if(!Array.isArray(s.recent))s.recent=[];if(!Array.isArray(s.bossDone))s.bossDone=[];

 if(s.cur&&(!QMAP[s.cur.qid]||!isInt(s.cur.att,0,1e12)))s.cur=null;
 const B=s.boss;if(B.active&&(!isInt(B.idx,0,BOSSES.length-1)||!isNum(B.hp,0,1e4)))s.boss=defState().boss;

 return{ok:why.length===0,why,s};

const CAP={answer:5e7,combo:1e9,reason:1e7,boss:1e10,box:2e9,mission:2e9};
const Ledger={
 /* 모든 돈 지급은 이 함수 하나로만 처리: 고유 ref 1회 지급, 상한·음수·NaN 검증 */
 grant(kind,amt,ref){
  if(!(kind in CAP))return 0;
  amt=Math.round(amt);if(!Number.isFinite(amt)||amt<=0)return 0;
  amt=Math.min(amt,CAP[kind]);
  if(!ref||S.paid.includes(ref))return 0;
  S.paid.push(ref);if(S.paid.length>500)S.paid.splice(0,S.paid.length-500);
  S.cash+=amt;S.earned+=amt;save(true);UI.money();checkLevel();return amt;
 },
 /* 건물 영업 수익: 실제 경과 시간과 현재 수익률로만 계산 (오프라인 수익 없음) */
 income(dt){
  if(!(dt>0)||dt>2.5)return 0;const ips=incomePerSec();if(ips<=0)return 0;
  const amt=Math.round(ips*dt);if(!(amt>0))return 0;
  S.cash+=amt;S.earned+=amt;save();UI.money();checkLevel();return amt;
 },
 penalty(amt,ref){amt=Math.round(Math.min(amt,S.cash));if(!Number.isFinite(amt)||amt<=0||!ref||S.paid.includes(ref))return 0;S.paid.push(ref);S.cash-=amt;S.spent+=amt;S.cnt.penalty=(S.cnt.penalty||0)+amt;save(true);UI.money();return amt},
 spend(amt,ref){
  amt=Math.round(amt);if(!Number.isFinite(amt)||amt<=0)return false;
  if(S.cash<amt||!ref||S.paid.includes(ref))return false;
  S.paid.push(ref);S.cash-=amt;S.spent+=amt;
  if(S.cash<0){S.cash+=amt;S.spent-=amt;return false}
  save(true);UI.money();return true;
 }
};

const Grade={
 essay(q,vs){
  const hangul=s=>(s.match(/[가-힣]/g)||[]).length;
  for(let i=0;i<vs.length;i++){const v=vs[i],short=q.fields.length>1&&i===0&&/색깔|사람/.test(q.fields[i]);const min=short?1:(q.minLen||6);
   if(hangul(v)<min)return{reject:short?'첫 번째 칸을 채워 주세요.':`${q.fields[i]} 칸을 조금 더 자세히 써 주세요. (한글 ${min}자 이상)`};
   if(!short){const ch=v.replace(/\s/g,'');if(new Set(ch).size<Math.min(5,ch.length*.5))return{reject:'같은 글자만 반복하면 안 돼요. 문장으로 써 주세요.'};
    if(/(.)\1{4,}/.test(ch))return{reject:'같은 글자를 계속 반복하지 마세요.'};if(hangul(v)/Math.max(1,ch.length)<.6)return{reject:'한글 문장으로 써 주세요.'}}
   if(q.noCopy&&norm(v)===norm(q.noCopy))return{reject:'<보기>를 그대로 베끼면 안 돼요. 나만의 생각을 써 주세요!'};
   if(norm(v).length>10&&norm(q.q).includes(norm(v)))return{reject:'문제를 그대로 옮겨 쓰지 말고 답을 써 주세요.'};}
  const all=vs.join(' ');
  if(q.question){const t=vs[0].trim();if(!/\?$|까\s*$|까요\s*$|나요\s*$|니\s*$|가요\s*$/.test(t))return{reject:'질문은 “~까?”, “~나요?”처럼 묻는 문장으로 끝나야 해요.'}}
  if(q.kw){const n=norm(all);const ok=q.kw.some(rs=>rs.every(g=>g.some(w=>n.includes(norm(w)))));
   return ok?{ok:true,msg:'핵심 내용이 들어 있어요!'}:{ok:false,msg:'핵심 내용이 빠졌어요. '+(q.kwHint||'')}}
  return{ok:true,msg:'성실하게 쓴 답으로 인정!'};
 }
};

      if(b.h>.42){c.fillStyle='#ffd34d';c.fillRect(x+w/2-1.5*devicePixelRatio,y-H*.05,3*devicePixelRatio,H*.05);c.fillStyle=Math.sin(t*4)>0?'#ff4f4f':'#ffd34d';c.beginPath();c.arc(x+w/2,y-H*.05,4*devicePixelRatio,0,7);c.fill()}}})});
   dust.forEach(d=>{d.y-=d.v;if(d.y<0){d.y=1;d.x=Math.random()}c.fillStyle=`rgba(255,225,120,${.4+.6*Math.abs(Math.sin(t*3+d.x*20))})`;c.beginPath();c.arc(d.x*W,d.y*H,d.s*devicePixelRatio,0,7);c.fill()});
   this.raf=requestAnimationFrame(loop)};loop();
  const ic=$('#startIcons');[['racecar',6,62,150],['gem',84,18,110],['moneybag',8,16,120],['crown',80,60,120],['coin',22,40,70],['h9',90,36,130],['bill',70,12,90],['yacht',16,80,120],['h10',78,80,140]].forEach(([k,x,y,s],i)=>ic.insertAdjacentHTML('beforeend',`<img src="${IMG[k]}" style="left:${x}%;top:${y}%;width:${s}px;animation-delay:${-i*.6}s">`));
  $('#stName').value=S.name||'';
  if(S.cnt.answered>0){$('#btnStart').textContent='이어하기 ▶';$('#stInfo').innerHTML=`저장된 기록: Lv.${S.level} ${esc(LEVELS[S.level-1].n)} · 순자산 ${won(netWorth())}`}
 },
 go(){const n=$('#stName').value.trim().slice(0,12);S.name=n;save(true);Snd.init();Snd.apply();Snd.fx.jackpot();
  const[x,y]=centerOf('#btnStart');FX.burst(x,y,90,['coin','bill','gem','star']);flash();
  $('#start').style.transition='transform .8s ease-in, opacity .8s';$('#start').style.transform='scale(1.6)';$('#start').style.opacity=0;
  setTimeout(()=>{cancelAnimationFrame(this.raf);$('#start').classList.add('hidden');$('#game').classList.remove('hidden');UI.all();setTab('quest');Snd.bgm(true);
   if(S.cnt.answered===0)Modal.open(helpHTML());R.playT=Date.now();},800)}
};

/* ============================== 전역 이벤트 (위임) ============================== */
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
 /* 같은 버튼 연타 방지 (250ms) */
 const t=pnow();if(b===R.lastBtn&&t-R.lastTap<250)return;R.lastBtn=b;R.lastTap=t;
 const a=b.dataset.act;
 ({closeModal:()=>{Snd.fx.click();Modal.close()},goBoss:()=>{Modal.close();setTab('boss')},goShop:()=>setTab('shop'),goQuest:()=>setTab('quest'),
  build:()=>City.build(+b.dataset.i),buyItem:()=>Shop.buy(b.dataset.k),openBox:()=>Box.open(+b.dataset.t),closeBox:()=>Box.close(),
  fightBoss:()=>Boss.start(+b.dataset.i),useMult2:()=>{if(S.tk.mult2<=0)return;S.tk.mult2--;S.mult2Sec+=60;save(true);Snd.fx.fever();toast('60초 동안 건물 수익 2배!','good','chart');if(R.tab==='city')City.render();if(R.tab==='box')Box.render();UI.chips()},
  armFever:()=>{if(S.tk.feverT<=0||S.tk.feverArmed)return;S.tk.feverArmed=1;save(true);b.disabled=true;b.textContent='🔥 피버권 장전됨';toast('다음 정답 때 피버타임이 발동해요!','good','fire')},
  resetAll:()=>Teacher.reset(),
  help:()=>Modal.open(helpHTML()),toggleMute:()=>{S.set.mute=S.set.mute?0:1;Snd.apply();save(true);Settings.open();$('#btnMute').innerHTML=im(S.set.mute?'mute':'sound')}
 }[a]||(()=>{}))()});
$$('.tab').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
$('#btnStart').addEventListener('click',()=>Start.go(),{once:true});
$('#btnSettings').addEventListener('click',()=>Settings.open());
$('#btnMute').addEventListener('click',()=>{Snd.init();S.set.mute=S.set.mute?0:1;Snd.apply();save(true);$('#btnMute').innerHTML=im(S.set.mute?'mute':'sound');toast(S.set.mute?'음소거':'소리 켜짐','',S.set.mute?'mute':'sound')});
$('#btnHelpStart').addEventListener('click',()=>Modal.open(helpHTML()));
document.addEventListener('touchstart',e=>{if(e.touches.length>1)e.preventDefault()},{passive:false});
document.addEventListener('dblclick',e=>e.preventDefault());
document.addEventListener('contextmenu',e=>{if(!e.target.closest('input,textarea'))e.preventDefault()});
addEventListener('resize',()=>{if(R.tab==='city')City.draw()});
addEventListener('beforeunload',()=>save(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)save(true);R.lastTick=Date.now()});

/* ============================== 메인 틱 (1초) ============================== */
R.lastTick=Date.now();let floatT=0;
setInterval(()=>{const t=Date.now();let dt=(t-R.lastTick)/1000;R.lastTick=t;if(document.hidden||$('#game').classList.contains('hidden'))return;
 dt=clamp(dt,0,2);if(R.playT){S.playMs+=dt*1000}
 if(S.open>0){const run=Math.min(S.open,dt);S.open=Math.max(0,S.open-dt);Ledger.income(run);if(S.open<=0){if(R.tab==='city')City.banner();if(baseIncome()>0)toast('가게 영업 종료! 문제를 맞혀 다시 열어요.','bad','timer')}}
 if(S.mult2Sec>0)S.mult2Sec=Math.max(0,S.mult2Sec-dt);
 Fever.tick(dt);Shop.tick(dt);UI.chips();
 floatT+=dt;if(floatT>=1.6){floatT=0;City.floatIncome()}
 if(R.tab==='city')City.refreshButtons();
},500);

/* ============================== 부팅 ============================== */
const L=load();S=L.s;
if(L.issues.length&&L.had){S.cnt.restored++;save(true);setTimeout(()=>toast(L.fromBackup?'저장 데이터 이상을 발견해 백업으로 복구했어요.':'저장 데이터에 비정상적인 값이 있어 안전한 기본값으로 복구했어요.','bad','shield'),900);try{console.warn('[복구]',L.issues)}catch(e){}}
if(S.boss.active&&S.cur&&S.cur.mode!=='boss')S.cur=null;
UI.level();Start.init();
})();
